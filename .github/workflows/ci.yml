name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Typecheck
      run: npm run typecheck

    - name: Run Linter
      run: npm run lint

    - name: Run Unit Tests
      run: npm run test:run

    - name: Build Application
      run: npm run build
      env:
        # Provide any necessary mock environment variables for the build
        VITE_MAPBOX_ACCESS_TOKEN: 'mock_token_for_ci'
        VITE_TURNSTILE_SITE_KEY: '1x00000000000000000000AA' # Cloudflare testing key

    # Note: E2E tests using Playwright typically require installing browsers.
    # To enable Playwright tests in CI, uncomment the following block:
    # - name: Install Playwright Browsers
    #   run: npx playwright install --with-deps
    # - name: Run Playwright tests
    #   run: npm run test:e2e
